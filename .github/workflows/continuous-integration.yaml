name: continuous integration
run-name: ${{ github.actor }} has triggered continuous integration workflow

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Clean install
              run: npm ci

            - name: Run ESLint
              run: npm run lint
